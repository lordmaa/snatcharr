{% extends 'base.html' %}
{% block title %} — Studios{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Studios</h1>
  <div style="display:flex;gap:0.75rem;">
    <button class="btn btn-secondary" onclick="selectAll()">Select All</button>
    <button class="btn btn-secondary" onclick="selectNone()">Clear</button>
    <button class="btn btn-primary" onclick="save()">Save</button>
  </div>
</div>
<p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1.25rem;">
  Only scenes from selected studios will appear in performer views and be available to snatch.
</p>

<div id="saved-msg" style="display:none;color:var(--green);font-size:0.875rem;margin-bottom:1rem;">✓ Saved</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0.5rem;">
  {% for studio in all_studios %}
  <label style="display:flex;align-items:center;gap:0.6rem;padding:0.6rem 0.75rem;
                background:var(--surface);border:1px solid var(--border);
                border-radius:var(--radius);cursor:pointer;transition:border-color 0.15s;"
         onmouseover="this.style.borderColor='var(--accent)'"
         onmouseout="this.style.borderColor=this.querySelector('input').checked ? 'var(--accent)' : 'var(--border)'">
    <input type="checkbox" name="studio" value="{{ studio }}"
           {% if studio in active %}checked{% endif %}
           onchange="this.closest('label').style.borderColor = this.checked ? 'var(--accent)' : 'var(--border)'"
           style="accent-color:var(--accent);width:15px;height:15px;">
    <span style="font-size:0.875rem;{% if studio in active %}color:var(--text);{% else %}color:var(--text-muted);{% endif %}">
      {{ studio }}
    </span>
  </label>
  {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<script>
function getSelected() {
  return [...document.querySelectorAll('input[name=studio]:checked')].map(el => el.value);
}
function selectAll() {
  document.querySelectorAll('input[name=studio]').forEach(el => {
    el.checked = true;
    el.closest('label').style.borderColor = 'var(--accent)';
    el.closest('label').querySelector('span').style.color = 'var(--text)';
  });
}
function selectNone() {
  document.querySelectorAll('input[name=studio]').forEach(el => {
    el.checked = false;
    el.closest('label').style.borderColor = 'var(--border)';
    el.closest('label').querySelector('span').style.color = 'var(--text-muted)';
  });
}
function save() {
  fetch('/api/studios', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({studios: getSelected()}),
  }).then(r => r.json()).then(() => {
    var msg = document.getElementById('saved-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);
  });
}
</script>
{% endblock %}
