{% extends 'base.html' %}
{% block title %} — Settings{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Settings</h1>
  <div id="saved-msg" style="display:none;color:var(--green);font-size:0.875rem;">✓ Saved</div>
</div>

<div style="max-width:560px;display:flex;flex-direction:column;gap:1.5rem;">

  <section style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;">Whisparr</div>
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <span class="test-result" id="test_whisparr_result"></span>
        <button class="btn btn-secondary" style="padding:0.3rem 0.7rem;font-size:0.8rem;" onclick="testConn('whisparr')">Test</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <div>
        <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">URL</label>
        <input id="whisparr_url" class="settings-input" value="{{ whisparr_url }}">
      </div>
      <div>
        <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">API Key</label>
        <input id="whisparr_key" class="settings-input" value="{{ whisparr_key }}">
      </div>
    </div>
  </section>

  <section style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;">Prowlarr</div>
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <span class="test-result" id="test_prowlarr_result"></span>
        <button class="btn btn-secondary" style="padding:0.3rem 0.7rem;font-size:0.8rem;" onclick="testConn('prowlarr')">Test</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <div>
        <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">URL</label>
        <input id="prowlarr_url" class="settings-input" value="{{ prowlarr_url }}">
      </div>
      <div>
        <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">API Key</label>
        <input id="prowlarr_key" class="settings-input" value="{{ prowlarr_key }}">
      </div>
    </div>
  </section>

  <section style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;">SABnzbd</div>
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <span class="test-result" id="test_sabnzbd_result"></span>
        <button class="btn btn-secondary" style="padding:0.3rem 0.7rem;font-size:0.8rem;" onclick="testConn('sabnzbd')">Test</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <div>
        <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">URL</label>
        <input id="sabnzbd_url" class="settings-input" value="{{ sabnzbd_url }}">
      </div>
      <div>
        <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">API Key</label>
        <input id="sabnzbd_key" class="settings-input" value="{{ sabnzbd_key }}">
      </div>
    </div>
  </section>

  <section style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;">qBittorrent <span style="font-size:0.65rem;color:var(--text-muted);text-transform:none;letter-spacing:0;">(fallback)</span></div>
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <span class="test-result" id="test_qbittorrent_result"></span>
        <button class="btn btn-secondary" style="padding:0.3rem 0.7rem;font-size:0.8rem;" onclick="testConn('qbittorrent')">Test</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <div>
        <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">URL</label>
        <input id="qbittorrent_url" class="settings-input" value="{{ qbittorrent_url }}">
      </div>
      <div style="display:flex;gap:0.75rem;">
        <div style="flex:1;">
          <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">Username</label>
          <input id="qbittorrent_user" class="settings-input" value="{{ qbittorrent_user }}">
        </div>
        <div style="flex:1;">
          <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">Password</label>
          <input id="qbittorrent_pass" class="settings-input" type="password" value="{{ qbittorrent_pass }}">
        </div>
      </div>
    </div>
  </section>

  <section style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;">
    <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;
                color:var(--text-muted);font-weight:600;margin-bottom:1rem;">Performers Filter</div>
    <div>
      <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">
        Whisparr tag name — only performers with this tag will appear (leave blank for all monitored)
      </label>
      <input id="performer_tag" class="settings-input" placeholder="e.g. legalporno" value="{{ performer_tag }}">
    </div>
  </section>

  <section style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:600;">Auto-Snatch</div>
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <span class="test-result" id="snatch_now_result"></span>
        <button class="btn btn-secondary" style="padding:0.3rem 0.7rem;font-size:0.8rem;" onclick="snatchNow()">Run Now</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <input type="checkbox" id="auto_snatch" style="accent-color:var(--accent);width:15px;height:15px;" {% if auto_snatch %}checked{% endif %}>
        <label for="auto_snatch" style="font-size:0.875rem;color:var(--text-muted);cursor:pointer;">Automatically snatch missing scenes for all monitored performers</label>
      </div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;">
        <div style="flex:1;min-width:160px;">
          <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">Run every (hours)</label>
          <input id="snatch_interval_h" class="settings-input" type="number" min="1" max="168" value="{{ snatch_interval_h }}">
        </div>
        <div style="flex:1;min-width:160px;">
          <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem;">Retry not-found after (days)</label>
          <input id="retry_not_found_d" class="settings-input" type="number" min="1" max="90" value="{{ retry_not_found_d }}">
        </div>
      </div>
    </div>
  </section>

  <button class="btn btn-primary" style="align-self:flex-start;" onclick="save()">Save Settings</button>
</div>
{% endblock %}

{% block head %}
<style>
.settings-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 0.5rem 0.75rem;
  font-size: 0.875rem;
  font-family: monospace;
  outline: none;
  transition: border-color 0.15s;
}
.settings-input:focus { border-color: var(--accent); }
.test-result { font-size: 0.8rem; font-weight: 500; }
.test-ok  { color: var(--green); }
.test-err { color: var(--red); }
</style>
{% endblock %}

{% block scripts %}
<script>
function testConn(service) {
  var urlEl  = document.getElementById(service + '_url');
  var result = document.getElementById('test_' + service + '_result');
  result.className = 'test-result';
  result.textContent = 'Testing…';
  var body = {service: service, url: urlEl.value.trim()};
  if (service === 'qbittorrent') {
    body.user = document.getElementById('qbittorrent_user').value.trim();
    body.key  = document.getElementById('qbittorrent_pass').value;
  } else {
    body.key = document.getElementById(service + '_key').value.trim();
  }
  fetch('/api/test', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  }).then(r => r.json()).then(d => {
    result.className = 'test-result ' + (d.ok ? 'test-ok' : 'test-err');
    result.textContent = d.ok ? ('✓ ' + d.msg) : ('✗ ' + d.msg);
  }).catch(() => {
    result.className = 'test-result test-err';
    result.textContent = '✗ Request failed';
  });
}

function snatchNow() {
  var res = document.getElementById('snatch_now_result');
  res.className = 'test-result'; res.textContent = 'Running…';
  fetch('/api/snatch-now', {method: 'POST'})
    .then(r => r.json())
    .then(d => {
      res.className = 'test-result test-ok';
      res.textContent = '✓ ' + d.msg;
    }).catch(() => { res.className = 'test-result test-err'; res.textContent = '✗ Failed'; });
}

function save() {
  var data = {
    whisparr_url:      document.getElementById('whisparr_url').value.trim(),
    whisparr_key:      document.getElementById('whisparr_key').value.trim(),
    prowlarr_url:      document.getElementById('prowlarr_url').value.trim(),
    prowlarr_key:      document.getElementById('prowlarr_key').value.trim(),
    sabnzbd_url:       document.getElementById('sabnzbd_url').value.trim(),
    sabnzbd_key:       document.getElementById('sabnzbd_key').value.trim(),
    qbittorrent_url:   document.getElementById('qbittorrent_url').value.trim(),
    qbittorrent_user:  document.getElementById('qbittorrent_user').value.trim(),
    qbittorrent_pass:  document.getElementById('qbittorrent_pass').value,
    performer_tag:     document.getElementById('performer_tag').value.trim(),
    auto_snatch:       document.getElementById('auto_snatch').checked,
    snatch_interval_h: parseInt(document.getElementById('snatch_interval_h').value),
    retry_not_found_d: parseInt(document.getElementById('retry_not_found_d').value),
  };
  fetch('/settings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  }).then(r => r.json()).then(() => {
    var msg = document.getElementById('saved-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);
  });
}
</script>
{% endblock %}
